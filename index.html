<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080e12" />
    <meta name="description" content="蝴蝶三维学习图谱：依据具名博物馆标本，观察大蓝闪蝶与帝王蝶的背腹面、形态差异和自然史。" />
    <title>鳞光 · 蝴蝶三维图谱</title>
  </head>
  <body>
    <div id="app">
      <main>
        <section class="gallery" aria-label="交互式蝴蝶展厅">
          <div id="viewport" tabindex="0" role="region" aria-label="3D蝴蝶。拖动旋转，滚轮缩放，上下方向键切换物种。"><span id="loading" role="status" hidden>正在加载标本…</span><div id="fallback" hidden role="status"><strong>暂时无法开启 3D 图谱</strong><p>此设备可能不支持 WebGL 2，或图形上下文已丢失。请尝试开启硬件加速后刷新。仍可浏览完整科普。</p></div></div>
          <div class="exhibit-nav" aria-label="展品切换，可在此区域上下滑动" title="上下滑动或 Shift + 滚轮切换"><button id="previous" aria-label="上一种蝴蝶" title="上一种蝴蝶（↑）">↑</button><span><b id="current-number">01</b> / 02</span><button id="next" aria-label="下一种蝴蝶" title="下一种蝴蝶（↓）">↓</button></div>
          <div class="gallery-bottom"><div class="view-tools" role="group" aria-label="观察面"><button id="view-dorsal" aria-label="观察背面" aria-pressed="true">背面</button><button id="view-ventral" aria-label="观察腹面" aria-pressed="false">腹面</button><button id="view-side" aria-label="观察侧面" title="侧面，90°" aria-pressed="false">侧面</button></div><div class="tools"><button id="zoom-out" aria-label="缩小" title="缩小（−）">−</button><button id="zoom-in" aria-label="放大" title="放大（+）">+</button><button id="reset" aria-label="重置视角" title="重置视角（R）">↺</button><button id="motion" aria-pressed="false">飞行观赏</button><button id="exit-flight" hidden>回到图谱</button></div><span id="flight-status" role="status"></span></div>
        </section>
        <aside class="information" aria-label="蝴蝶科普信息" tabindex="0"><div id="species-content" aria-live="polite" aria-atomic="true"></div></aside>
      </main>
      <footer><span>鳞光 · 蝴蝶三维图谱</span><span class="footer-links"><span>依标本学习 · 差异与待核对处见资料</span><a href="https://github.com/nazhenhuiyi/butterfly-museum" target="_blank" rel="noopener noreferrer" aria-label="GitHub 源码仓库（新窗口）">GitHub ↗</a></span></footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
